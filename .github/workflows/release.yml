# A release is published only after every native build, Authenticode check, and
# the dedicated Windows 11/WSL2/WebView2 transaction succeeds.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]
          source_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          [[ "$source_commit" == "$GITHUB_SHA" && "$tag_commit" == "$source_commit" ]]
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

  native-dist:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cache/zig
          key: zig-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty-vt.sh', 'third_party/libghostty-vt/build.zig.zon') }}
      - run: make vt
      - run: make test-ghostty
      - run: make dist
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  wsl-payload:
    needs: validate-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cache/zig
          key: zig-wsl-release-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty-vt.sh', 'third_party/libghostty-vt/build.zig.zon') }}
      - run: make vt
      - name: Build Ubuntu 24.04/amd64 payload
        env:
          CATS_RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: make wsl-payload-dist
      - run: make test-wsl-host-integration
      - uses: actions/attest@v4
        with:
          subject-path: dist/cats-wsl-payload_*_ubuntu-24.04_linux_amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cats-wsl-payload
          path: dist/cats-wsl-payload_*_ubuntu-24.04_linux_amd64.tar.gz
          if-no-files-found: error

  windows-wsl-dist:
    needs: [validate-tag, wsl-payload]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain
      - shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\ucrt64\bin'
      - uses: actions/download-artifact@v4
        with:
          name: cats-wsl-payload
          path: dist
      - id: signing
        name: Import release signing certificate
        shell: powershell
        env:
          CATS_SIGNING_PFX_BASE64: ${{ secrets.CATS_SIGNING_PFX_BASE64 }}
          CATS_SIGNING_PFX_PASSWORD: ${{ secrets.CATS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:CATS_SIGNING_PFX_BASE64 -or -not $env:CATS_SIGNING_PFX_PASSWORD) { throw 'release signing secrets are required' }
          $pfx = Join-Path $env:RUNNER_TEMP 'cats-release-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CATS_SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:CATS_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $certificate = $imported | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw 'PFX did not contain a certificate with a private key' }
          }
          finally { Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Windows policy and protocol tests
        shell: powershell
        run: |
          .\scripts\windows\Test-CatsInstaller.ps1
          go test -count=1 .\cmd\catapp .\internal\desktopproto .\internal\wslclient
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: package
        name: Build signed coupled archive
        shell: powershell
        run: |
          $payload = (Get-ChildItem .\dist\cats-wsl-payload_*_ubuntu-24.04_linux_amd64.tar.gz -File).FullName
          .\scripts\windows\Build-WindowsDist.ps1 -PayloadArchive $payload `
            -ReleaseVersion '${{ needs.validate-tag.outputs.version }}' `
            -CertificateThumbprint '${{ steps.signing.outputs.thumbprint }}' -RequireSigned
          $archive = (Get-ChildItem .\dist\cats_*_windows_amd64_wsl_ubuntu-24.04_amd64.zip -File).FullName
          .\scripts\windows\Test-CatsReleasePackage.ps1 -PackageArchive $archive `
            -ExpectedVersion '${{ needs.validate-tag.outputs.version }}' -RequireSigned
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: cats-windows-wsl
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
      - name: Remove signing certificate
        if: always() && steps.signing.outputs.thumbprint != ''
        shell: powershell
        run: Remove-Item -LiteralPath 'Cert:\CurrentUser\My\${{ steps.signing.outputs.thumbprint }}' -Force

  windows-11-wsl2-gui:
    needs: [validate-tag, windows-wsl-dist]
    runs-on: [self-hosted, Windows, X64, cats-wsl2-gui]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain
      - shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\ucrt64\bin'
      - uses: actions/download-artifact@v4
        with:
          name: cats-windows-wsl
          path: dist
      - name: Signed install and real GUI transaction
        shell: powershell
        env:
          CATS_WSL_DISTRO: ${{ vars.CATS_WSL_DISTRO }}
          CATS_WSL_USER: ${{ vars.CATS_WSL_USER }}
        run: |
          if (-not $env:CATS_WSL_DISTRO -or -not $env:CATS_WSL_USER) { throw 'CATS_WSL_DISTRO and CATS_WSL_USER repository variables are required' }
          $archive = (Get-ChildItem .\dist\cats_*_windows_amd64_wsl_ubuntu-24.04_amd64.zip -File).FullName
          .\scripts\windows\Test-CatsReleaseCandidate.ps1 -PackageArchive $archive `
            -Distribution $env:CATS_WSL_DISTRO -User $env:CATS_WSL_USER `
            -ExpectedVersion '${{ needs.validate-tag.outputs.version }}' `
            -IncludePhase8Qualification -IncludeDistributionShutdownQualification

  publish:
    needs: [validate-tag, native-dist, wsl-payload, windows-wsl-dist, windows-11-wsl2-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate release manifest and checksums
        run: bash scripts/generate-release-manifest.sh '${{ needs.validate-tag.outputs.version }}' '${{ needs.validate-tag.outputs.source_commit }}' release-artifacts release-artifacts/release-manifest.json
      - uses: actions/attest@v4
        with:
          subject-path: |
            release-artifacts/release-manifest.json
            release-artifacts/SHA256SUMS
      - name: Create complete draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            [[ $(cat draft-state.txt) == true ]]
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* --draft --verify-tag --generate-notes --title "CATS $GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false
