# CI: fast platform jobs, strict docs, and the real Ghostty and WSL-host
# integration paths. Ghostty-tagged CGO builds use the vendored libghostty-vt
# (third_party/), compiled with pinned Zig 0.15.2.
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make build
      - run: make test
      - name: Shared Windows/WSL protocol goldens
        run: make test-protocol-golden
      - name: Workflow syntax and expression checks
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  windows-fast:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain
      - shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\ucrt64\bin'
      - name: Format and PowerShell parse checks
        shell: powershell
        run: |
          $bad = @(gofmt -l cmd internal)
          if ($bad.Count -ne 0) { throw "gofmt needed: $($bad -join ', ')" }
          Get-ChildItem .\scripts\windows\*.ps1, .\scripts\windows\*.psm1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$($_.Name): $($errors -join '; ')" }
          }
      - name: Windows vet and unit/integration seams
        shell: powershell
        run: |
          go vet .\internal\desktopproto .\internal\wslclient
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 .\cmd\catapp .\internal\desktopproto .\internal\wslclient
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\windows\Test-CatsInstaller.ps1
      - name: Native CGO WebView2 launcher
        shell: powershell
        run: .\scripts\windows\Build-WindowsLauncher.ps1 -OutputPath .\bin\Cats.exe
      - name: Windows browser policy and Edge integration
        shell: powershell
        run: |
          node --test .\cmd\catway\web\platform.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\scripts\test-webui-edge.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-wsl-host-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cache/zig
          key: zig-wsl-integration-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty-vt.sh', 'third_party/libghostty-vt/build.zig.zon') }}
      - run: make vt
      - name: Helper supervision with test daemons
        run: go test -count=1 ./cmd/cats-wsl-host
      - run: make wsl-payload
      - name: Real helper, daemons, and browser-protocol probe
        run: make test-wsl-host-integration

  ghostty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty-vt.sh', 'third_party/libghostty-vt/build.zig.zon') }}
      - uses: actions/cache@v4
        with:
          path: |
            third_party/libghostty-vt/zig-out
            third_party/libghostty-vt/.zig-cache
          key: vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/libghostty-vt/**', '!third_party/libghostty-vt/zig-out/**', '!third_party/libghostty-vt/.zig-cache/**', 'scripts/build-libghostty-vt.sh') }}
      - run: make vt
      - run: make vet-ghostty
      - run: make race-ghostty

  # The docs site. It is served by gkdocs, but mkdocs.yml invites `mkdocs build`
  # and both must keep working, so this job checks what the two renderers share:
  # the content. Cheap (~30s, no Go, no Zig) and it runs unconditionally rather
  # than behind a paths filter — a docs page can break from a link in a page
  # that did not change.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict promotes warnings to errors; mkdocs.yml's validation block is
      # what makes broken relative links and #anchors warnings in the first
      # place. Neither half catches link rot alone.
      - run: mkdocs build --strict
      # gkdocs — the renderer that actually serves the site — does not implement
      # python-markdown admonitions, so a `!!! note` reaches the page as literal
      # text. mkdocs renders them happily, which is precisely why the strict
      # build above cannot catch this and a grep has to.
      - name: No '!!!' admonitions (gkdocs renders them literally)
        run: |
          if grep -rn '^!!!' docs; then
            echo "::error::gkdocs cannot render '!!!' admonitions — use a '> **Note — ...**' blockquote instead."
            exit 1
          fi
