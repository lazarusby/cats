# CI: fast platform jobs plus the real Ghostty and WSL-host integration paths.
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make build
      - run: make test
      - name: Shared Windows/WSL protocol goldens
        run: make test-protocol-golden
      - name: Workflow syntax and expression checks
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  windows-fast:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain
      - shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\ucrt64\bin'
      - name: Format and PowerShell parse checks
        shell: powershell
        run: |
          $bad = @(gofmt -l cmd internal)
          if ($bad.Count -ne 0) { throw "gofmt needed: $($bad -join ', ')" }
          Get-ChildItem .\scripts\windows\*.ps1, .\scripts\windows\*.psm1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$($_.Name): $($errors -join '; ')" }
          }
      - name: Windows vet and unit/integration seams
        shell: powershell
        run: |
          go vet .\internal\desktopproto .\internal\wslclient
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 .\cmd\catapp .\internal\desktopproto .\internal\wslclient
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\windows\Test-CatsInstaller.ps1
      - name: Native CGO WebView2 launcher
        shell: powershell
        run: .\scripts\windows\Build-WindowsLauncher.ps1 -OutputPath .\bin\Cats.exe

  linux-wsl-host-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cache/zig
          key: zig-wsl-integration-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty-vt.sh', 'third_party/libghostty-vt/build.zig.zon') }}
      - run: make vt
      - name: Helper supervision with test daemons
        run: go test -count=1 ./cmd/cats-wsl-host
      - run: make wsl-payload
      - name: Real helper, daemons, and browser-protocol probe
        run: make test-wsl-host-integration

  ghostty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty-vt.sh', 'third_party/libghostty-vt/build.zig.zon') }}
      - uses: actions/cache@v4
        with:
          path: |
            third_party/libghostty-vt/zig-out
            third_party/libghostty-vt/.zig-cache
          key: vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/libghostty-vt/**', '!third_party/libghostty-vt/zig-out/**', '!third_party/libghostty-vt/.zig-cache/**', 'scripts/build-libghostty-vt.sh') }}
      - run: make vt
      - run: make vet-ghostty
      - run: make race-ghostty
